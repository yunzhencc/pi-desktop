name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: test "v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')" = "$GITHUB_REF_NAME"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            command: pnpm build:mac -- --arm64
          - name: macOS x64
            os: macos-15-intel
            command: pnpm build:mac -- --x64
          - name: Windows
            os: windows-latest
            command: pnpm build:win
          - name: Linux
            os: ubuntu-latest
            command: pnpm build:linux
    steps:
      - name: Setup JavaScript
        uses: sxzz/workflows/setup-js@v2
        with:
          node-version: 24.12.0
      - name: Build
        run: ${{ matrix.command }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.blockmap
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.snap
            dist/*.yml
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "${assets[@]}"
